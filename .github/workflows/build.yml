name: Build

# Push na main: so valida que o app compila (universal, ad-hoc; sem certificado nem artefato).
# Release publicada: gera o DevStatus.app universal, assina com o certificado das releases e anexa
# o zip + .sha256 a release (o install.sh do site baixa esses arquivos).
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build DevStatus.app (universal, ad-hoc)
        run: DEVSTATUS_UNIVERSAL=1 ./build.sh

      - name: Check architectures
        run: |
          archs="$(lipo -archs DevStatus.app/Contents/MacOS/DevStatus)"
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

  release:
    if: github.event_name == 'release'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Swift version
        run: swift --version

      # Certificado autoassinado fixo (secrets): a assinatura fica igual entre versões e o macOS
      # mantém Acessibilidade, Automação e Keychain nas atualizações.
      - name: Import signing certificate
        id: cert
        env:
          P12: ${{ secrets.DEVSTATUS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.DEVSTATUS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::DEVSTATUS_SIGNING_P12 / DEVSTATUS_SIGNING_P12_PASSWORD missing."
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 1800 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"

      - name: Build DevStatus.app (universal)
        env:
          DEVSTATUS_SIGN_IDENTITY: ${{ vars.DEVSTATUS_SIGN_IDENTITY }}
          DEVSTATUS_REQUIRE_SIGN: "1"
        run: DEVSTATUS_UNIVERSAL=1 ./build.sh

      - name: Check signature
        env:
          IDENTITY: ${{ vars.DEVSTATUS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --verify --strict DevStatus.app
          req="$(codesign -d -r- DevStatus.app 2>&1)"
          echo "$req"
          echo "$req" | grep -qi "certificate root = H\"$IDENTITY\""

      - name: Remove signing keychain
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}" || true

      - name: Check architectures
        run: |
          archs="$(lipo -archs DevStatus.app/Contents/MacOS/DevStatus)"
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - name: Package
        run: |
          ZIP="DevStatus-${TAG}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent DevStatus.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
